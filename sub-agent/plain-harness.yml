max_iterations: 25

model:
  provider: openai_compatible
  endpoint: http://localhost:8080/v1
  name: "Qwen3.8-27B-S"
  timeout_seconds: 600

system_prompt_files:
  - ./prompts/SOUL.md
  - ./prompts/AGENT.md

mcp_servers:
  - name: "scripts-mcp"
    stdio:
      git:
        url: git@github.com:harsig/scripts-mcp.git
        ref: v1.0.0
      setup:
        - ["./build.sh"]
        - ["./bin/scripts-mcp", "--setup", "./scripts-mcp.yml"]
      command: ./bin/scripts-mcp
      args: ["./scripts-mcp.yml"]

  - name: "skills-mcp"
    stdio:
      setup:
        - ["../../skills-mcp/bin/skills-mcp", "--setup", "./skills-mcp.yml"]
      command: ../../skills-mcp/bin/skills-mcp
      args: ["./skills-mcp.yml"]
